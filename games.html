  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
                  <filter id="fur-edge" x="-60%" y="-60%" width="220%" height="220%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="wave"/>
        <feDisplacementMap in="SourceGraphic" in2="wave" scale="24" xChannelSelector="R" yChannelSelector="G" result="swell"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="clump"/>
        <feDisplacementMap in="swell" in2="clump" scale="9" xChannelSelector="R" yChannelSelector="G" result="lobe"/>
        <feGaussianBlur in="lobe" stdDeviation="0.9"/>
      </filter>
      <filter id="fur-inner" x="-35%" y="-35%" width="170%" height="170%">
        <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="11" result="hair2"/>
        <feDisplacementMap in="SourceGraphic" in2="hair2" scale="9" xChannelSelector="R" yChannelSelector="G" result="shred2"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="3" seed="13" result="clump2"/>
        <feDisplacementMap in="shred2" in2="clump2" scale="10" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="fur-fine" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="0.14 0.2" numOctaves="5" seed="3" result="n2"/>
        <feDisplacementMap in="SourceGraphic" in2="n2" scale="12" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>
